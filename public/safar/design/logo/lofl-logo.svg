  <path d="M60 71 L23 112 L33 112 Z" fill="#BF4131"/>
  <path d="M60 71 L36 112 L46 112 Z" fill="#E07D38"/>
  <path d="M60 71 L49 112 L59 112 Z" fill="#E9B23E"/>
  <path d="M60 71 L61 112 L71 112 Z" fill="#6B9A40"/>
  <path d="M60 71 L74 112 L84 112 Z" fill="#346FA6"/>
  <path d="M60 71 L87 112 L97 112 Z" fill="#7B4F9E"/>
</svg>
